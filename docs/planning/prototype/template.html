<title>namutok 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one full-height vertical snap feed; each card = media box on top, edit-log labels + title + summary below. Single dark look on purpose (media feed). */
:root {
  --ink: #0e1115;
  --panel: #161a20;
  --text: #ecf0f3;
  --soft: #cfd6dc;
  --muted: #98a2ad;
  --line: #2a3038;
  --hl: #f2c14e;
  --hl-ink: #1b1505;
  --like: #ff8fa3;
  --scrim: rgba(5, 7, 9, .78);
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--sans); overflow: hidden; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; border-inline: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.mark { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.mark b { background: var(--hl); color: var(--hl-ink); padding: 0 4px; margin-left: 1px; border-radius: 2px; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.stop { font: 600 13px var(--sans); color: var(--text); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }

.feed { flex: 1; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; outline: none; }
.card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; overflow: hidden; }
.media { flex: 0 0 42%; position: relative; background: var(--panel) center / cover no-repeat; overflow: hidden; }
.media::before { content: ""; position: absolute; inset: -20px; background: inherit; filter: blur(22px) brightness(.55); }
.media img { position: relative; width: 100%; height: 100%; object-fit: contain; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-block: 18px 14px; }
.card.noimg .body { justify-content: center; }
.labels { display: flex; flex-wrap: wrap; gap: 6px; font: 500 12px var(--mono); }
.live { background: var(--hl); color: var(--hl-ink); padding: 3px 7px; border-radius: 3px; }
.sub { border: 1px solid var(--hl); color: var(--hl); padding: 2px 7px; border-radius: 3px; overflow-wrap: anywhere; }
h2 { margin: 0; font-size: clamp(24px, 6.4vw, 30px); line-height: 1.22; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.card.noimg h2 { font-size: clamp(30px, 9vw, 40px); }
.sum { margin: 0; color: var(--soft); font-size: 15.5px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.card.noimg .sum { -webkit-line-clamp: 9; }
.sum.empty { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 8px; margin-top: auto; }
.btn { font: 600 14px var(--sans); border-radius: 10px; padding: 11px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.go { background: var(--text); color: var(--ink); border: 0; flex: 1; justify-content: center; }
.btn.like { background: none; color: var(--text); border: 1px solid var(--line); }
.btn.like[aria-pressed="true"] { color: var(--like); border-color: var(--like); }
.src { margin: 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }

.intro .body, .end .body { justify-content: center; gap: 16px; }
.eyebrow { font: 500 12px var(--mono); color: var(--hl); letter-spacing: .04em; }
.intro h2, .end h2 { font-size: clamp(28px, 8vw, 38px); }
.lead { margin: 0; color: var(--soft); font-size: 16px; line-height: 1.65; max-width: 34em; }
.hint { font: 500 13px var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; text-align: center; }
.stat b { display: block; font: 600 30px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }

.sheet { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: end center; z-index: 20; }
.sheet-in { width: min(560px, 100%); background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 16px; padding-block: 22px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 0; font-size: 20px; }

button:focus-visible, a:focus-visible, .feed:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top gut">
    <div class="mark">namu<b>tok</b></div>
    <span class="count" id="count" aria-live="polite"></span>
    <button class="stop" id="stop" type="button">그만 보기</button>
  </header>
  <main class="feed" id="feed" tabindex="0" aria-label="카드 피드"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in gut" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <h3 id="sheet-h">여기까지 본 기록</h3>
    <div class="stats" id="sheet-stats"></div>
    <p class="lead">이 숫자를 링크 보내 준 사람에게 알려 주세요.</p>
    <button class="btn go" id="resume" type="button">계속 보기</button>
  </div>
</div>

<script>
const CARDS = /*CARDS*/[];
const SNAP = /*SNAP*/"";
const feed = document.getElementById('feed');
const fmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
const t = s => fmt.format(new Date(s * 1000));
const seen = new Set(), liked = new Set(); let opened = 0;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function statsInto(box) {
  box.replaceChildren();
  [[seen.size, '본 카드'], [opened, '원문 열기'], [liked.size, '좋아요']].forEach(([n, l]) => {
    const s = el('div', 'stat'); s.append(el('b', '', String(n)), el('span', '', l)); box.append(s);
  });
}

const times = CARDS.map(c => c.date);
const intro = el('section', 'card intro');
const ib = el('div', 'body gut');
ib.append(el('div', 'eyebrow', 'NAMUTOK 프로토타입 · 테스트용'),
  el('h2', '', `나무위키에서 편집되고 있던 문서 ${CARDS.length}개`),
  el('p', 'lead', `${SNAP} ${t(Math.min(...times))}~${t(Math.max(...times))} 사이에 편집된 문서를 최근 순서로 모았습니다. 보고 싶은 만큼 넘기다가, 그만 보고 싶으면 위의 '그만 보기'를 누르세요.`),
  el('div', 'hint', '↑ 위로 넘기기'));
intro.append(ib); feed.append(intro);

CARDS.forEach((c, i) => {
  const card = el('article', 'card' + (c.img ? '' : ' noimg')); card.dataset.i = i;
  if (c.img) {
    const m = el('div', 'media'); m.style.backgroundImage = `url("${c.img}")`;
    const img = el('img'); img.src = c.img; img.alt = ''; img.decoding = 'async'; m.append(img); card.append(m);
  }
  const b = el('div', 'body gut');
  const labels = el('div', 'labels');
  labels.append(el('span', 'live', `${t(c.date)} 편집`));
  if (c.subs && c.subs.length) labels.append(el('span', 'sub', `하위 문서 '${c.subs[0]}'${c.subs.length > 1 ? ` 외 ${c.subs.length - 1}개` : ''} 편집 중`));
  const url = 'https://namu.wiki/w/' + encodeURIComponent(c.title);
  const go = el('a', 'btn go', '원문 보기 ↗'); go.href = url; go.target = '_blank'; go.rel = 'noopener';
  go.addEventListener('click', () => { opened++; });
  const like = el('button', 'btn like', '♡ 좋아요'); like.type = 'button'; like.setAttribute('aria-pressed', 'false');
  like.addEventListener('click', () => {
    const on = !liked.has(i); on ? liked.add(i) : liked.delete(i);
    like.setAttribute('aria-pressed', String(on)); like.textContent = on ? '♥ 좋아요' : '♡ 좋아요';
  });
  const actions = el('div', 'actions'); actions.append(go, like);
  const src = el('p', 'src'); src.append('출처: ');
  const sa = el('a', '', `나무위키 「${c.title}」`); sa.href = url; sa.target = '_blank'; sa.rel = 'noopener';
  src.append(sa, ' · CC BY-NC-SA 2.0 KR');
  b.append(labels, el('h2', '', c.title), el('p', 'sum' + (c.summary ? '' : ' empty'), c.summary || '요약이 없는 문서입니다. 원문에서 확인하세요.'), actions, src);
  card.append(b); feed.append(card);
});

const end = el('section', 'card end');
const eb = el('div', 'body gut'); const es = el('div', 'stats');
eb.append(el('div', 'eyebrow', '끝'), el('h2', '', '끝까지 보셨습니다'), es,
  el('p', 'lead', '이 숫자를 링크 보내 준 사람에게 알려 주세요. 고맙습니다.'));
end.append(eb); feed.append(end);

const count = document.getElementById('count');
const updateCount = cur => { count.textContent = cur == null ? `${CARDS.length}장` : `${cur + 1} / ${CARDS.length}`; };
updateCount(null);
const io = new IntersectionObserver(list => list.forEach(e => {
  if (!e.isIntersecting) return;
  const i = e.target.dataset.i;
  if (i != null) { seen.add(+i); updateCount(+i); }
  if (e.target === end) statsInto(es);
}), { root: feed, threshold: 0.6 });
feed.querySelectorAll('.card').forEach(c => io.observe(c));

const sheet = document.getElementById('sheet');
const closeSheet = () => { sheet.hidden = true; feed.focus(); };
document.getElementById('stop').addEventListener('click', () => { statsInto(document.getElementById('sheet-stats')); sheet.hidden = false; document.getElementById('resume').focus(); });
document.getElementById('resume').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
feed.focus({ preventScroll: true });
</script>
